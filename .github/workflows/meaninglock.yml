name: MeaningLock validation

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned tooling
        run: python -m pip install -r requirements-dev.txt
      - name: GenVM lint
        run: genvm-lint check contracts/meaning_lock.py
      - name: GenVM validate
        run: genvm-lint validate contracts/meaning_lock.py
      - name: GenVM schema
        run: genvm-lint schema contracts/meaning_lock.py --output evidence/meaning_lock.schema.json
      - name: GenVM typecheck
        run: genvm-lint typecheck contracts/meaning_lock.py
      - name: Seed Direct Mode GenVM cache
        shell: bash
        run: |
          # genlayer-test 0.29.2 still requests the retired universal asset
          # name.  The rc7 release publishes the same runner bundle as
          # genvm-runners-all.tar.xz; seed the cache under the filename the
          # loader expects so Direct Mode does not fail with HTTP 404.
          mkdir -p "$HOME/.cache/gltest-direct"
          curl -fsSL "https://github.com/genlayerlabs/genvm/releases/download/v0.3.0-rc7/genvm-runners-all.tar.xz" \
            -o "$HOME/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz"
      - name: Direct Mode tests
        run: gltest tests/direct -q
